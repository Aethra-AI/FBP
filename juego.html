<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pato Esquivador</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #87CEEB;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 400px;
      border: 3px solid #000;
      background-color: #a8d5a2;
      overflow: hidden;
    }

    #duck {
      position: absolute;
      width: 60px;
      height: 50px;
      bottom: 80px;
      left: 100px;
      background-image: url('https://i.imgur.com/6fL8RlT.png'); /* Pato simple */
      background-size: cover;
      z-index: 10;
    }

    .obstacle {
      position: absolute;
      width: 40px;
      height: 60px;
      bottom: 80px;
      background-color: #8B4513;
      right: -50px;
      border-radius: 5px;
    }

    #ground {
      position: absolute;
      width: 100%;
      height: 80px;
      bottom: 0;
      background-color: #8B4513;
    }

    #score {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 24px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    #start-screen, #game-over-screen {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      z-index: 100;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="duck"></div>
    <div id="ground"></div>
    <div id="score">Puntuación: 0</div>

    <!-- Pantalla de inicio -->
    <div id="start-screen">
      <h1>Pato Esquivador</h1>
      <p>Presiona ESPACIO para saltar</p>
      <button id="start-button">Iniciar Juego</button>
    </div>

    <!-- Pantalla de fin -->
    <div id="game-over-screen" style="display: none;">
      <h1>¡Juego Terminado!</h1>
      <p>Tu puntuación: <span id="final-score">0</span></p>
      <button id="restart-button">Jugar de Nuevo</button>
    </div>
  </div>

  <script>
    // Elementos del DOM
    const duck = document.getElementById('duck');
    const gameContainer = document.getElementById('game-container');
    const scoreDisplay = document.getElementById('score');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startButton = document.getElementById('start-button');
    const restartButton = document.getElementById('restart-button');
    const finalScore = document.getElementById('final-score');

    // Variables del juego
    let isJumping = false;
    let gravity = 0.9;
    let position = 0;
    let isGameOver = false;
    let score = 0;
    let gameSpeed = 3;
    let obstacles = [];
    let obstacleInterval;
    let gameLoop;

    // Función para hacer saltar al pato
    function jump() {
      if (isJumping || isGameOver) return;
      isJumping = true;
      position = 0;
      let jumpHeight = 150;
      let upTime = 0;

      let jumpInterval = setInterval(() => {
        // Subida
        if (upTime < 15) {
          position += 10;
          upTime++;
        } 
        // Bajada
        else if (position > 0) {
          position -= 10;
        } else {
          clearInterval(jumpInterval);
          isJumping = false;
        }
        duck.style.bottom = (80 + position) + 'px';
      }, 20);
    }

    // Generar obstáculos
    function createObstacle() {
      const obstacle = document.createElement('div');
      obstacle.classList.add('obstacle');
      gameContainer.appendChild(obstacle);
      obstacles.push(obstacle);

      let rightPos = 0;
      const randomTime = Math.random() * 2000 + 1000; // cada 1-3 segundos

      let obstacleTimer = setInterval(() => {
        if (rightPos > 800) {
          clearInterval(obstacleTimer);
          obstacle.remove();
          obstacles = obstacles.filter(o => o !== obstacle);
          score++;
          scoreDisplay.textContent = `Puntuación: ${score}`;
          
          // Aumentar velocidad progresivamente
          if (score % 5 === 0) {
            gameSpeed += 0.5;
          }
        } else if (!isGameOver) {
          rightPos += gameSpeed;
          obstacle.style.right = rightPos + 'px';

          // Detectar colisión
          if (
            rightPos > 740 &&
            rightPos < 800 &&
            position < 60
          ) {
            clearInterval(obstacleTimer);
            endGame();
          }
        }
      }, 20);
    }

    // Iniciar juego
    function startGame() {
      isGameOver = false;
      score = 0;
      gameSpeed = 3;
      obstacles.forEach(o => o.remove());
      obstacles = [];
      scoreDisplay.textContent = `Puntuación: ${score}`;
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';

      // Generar obstáculos
      obstacleInterval = setInterval(createObstacle, 1500);

      // Loop principal (opcional, por si necesitas más lógica)
      gameLoop = setInterval(() => {}, 1000 / 60);
    }

    // Terminar juego
    function endGame() {
      isGameOver = true;
      clearInterval(obstacleInterval);
      clearInterval(gameLoop);
      finalScore.textContent = score;
      gameOverScreen.style.display = 'flex';
    }

    // Event Listeners
    startButton.addEventListener('click', startGame);
    restartButton.addEventListener('click', startGame);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault(); // Evita que la página se desplace
        jump();
      }
    });

    // Para dispositivos táctiles
    gameContainer.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jump();
    });
  </script>
</body>
</html>
